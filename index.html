<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoMaster Chatbot</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}
.wrap{background:#0d0d0d;border-radius:16px;overflow:hidden;width:420px;display:flex;flex-direction:column;height:580px;border:1px solid #2a2a2a}
.header{background:#1a1a1a;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a2a2a}
.logo{width:42px;height:42px;background:#e82020;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#fff;text-align:center;line-height:1.2}
.info h2{font-size:15px;font-weight:700;color:#fff}
.info p{font-size:11px;color:#888}
.dot{width:7px;height:7px;background:#4ade80;border-radius:50%;display:inline-block;margin-right:4px}
.badge{font-size:10px;background:#4ade80;color:#000;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:6px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.bot{background:#1e1e1e;color:#f0f0f0;border-radius:4px 12px 12px 12px;align-self:flex-start;border-left:3px solid #e82020}
.user{background:#e82020;color:#fff;border-radius:12px 4px 12px 12px;align-self:flex-end}
.typing{background:#1e1e1e;color:#666;align-self:flex-start;border-radius:4px 12px 12px 12px;font-style:italic;font-size:12px}
.input-area{padding:12px 16px;background:#1a1a1a;display:flex;gap:8px;align-items:center;border-top:1px solid #2a2a2a}
input{flex:1;background:#0d0d0d;border:1px solid #333;border-radius:22px;padding:10px 16px;color:#f0f0f0;font-size:13px;outline:none}
input:focus{border-color:#e82020}
input::placeholder{color:#444}
button{width:40px;height:40px;background:#e82020;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
button svg{width:16px;height:16px;fill:white}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">AUTO<br>MASTER</div>
    <div class="info">
      <h2>AutoMaster <span class="badge">IA REAL</span></h2>
      <p><span class="dot"></span>Powered by Groq</p>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="input-area">
    <input id="inp" placeholder="Pergunte qualquer coisa..." onkeydown="if(event.key==='Enter')send()"/>
    <button onclick="send()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
  </div>
</div>
<script>
const m=document.getElementById('msgs');
const i=document.getElementById('inp');
let h=[];
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
async function send(){
  const v=i.value.trim();if(!v)return;
  add(v,'user');i.value='';
  h.push({role:'user',content:v});
  const t=add('digitando...','typing');
  try{
    const r=await fetch('https://chatbot-oficina-production.up.railway.app/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:h})});
    const d=await r.json();t.remove();
    if(d.reply){add(d.reply,'bot');h.push({role:'assistant',content:d.reply});}
    else{add('Erro: '+JSON.stringify(d),'bot');}
  }catch(e){t.remove();add('Erro: '+e.message,'bot');}
}
add('Olá! 👋 Bem-vindo à AutoMaster Oficina!\n\nSou um assistente com IA real. Como posso te ajudar?','bot');
</script>
</body>
</html>
