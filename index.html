<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WV7 Funilaria — Atendimento</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}
.wrap{background:#0d0d0d;border-radius:16px;overflow:hidden;width:420px;display:flex;flex-direction:column;height:580px;border:1px solid #1a1a1a;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.header{background:#0d0d0d;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a1a1a}
.logo{width:48px;height:48px;background:#000;border-radius:10px;border:2px solid #39ff14;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#39ff14;text-align:center;line-height:1.2;letter-spacing:1px}
.info h2{font-size:15px;font-weight:700;color:#fff}
.info p{font-size:11px;color:#888}
.dot{width:7px;height:7px;background:#39ff14;border-radius:50%;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.badge{font-size:10px;background:#39ff14;color:#000;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:6px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#0d0d0d}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
.msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.bot{background:#1a1a1a;color:#f0f0f0;border-radius:4px 12px 12px 12px;align-self:flex-start;border-left:3px solid #39ff14}
.user{background:#39ff14;color:#000;font-weight:500;border-radius:12px 4px 12px 12px;align-self:flex-end}
.typing{background:#1a1a1a;color:#666;align-self:flex-start;border-radius:4px 12px 12px 12px;font-style:italic;font-size:12px}
.input-area{padding:12px 16px;background:#0d0d0d;display:flex;gap:8px;align-items:center;border-top:1px solid #1a1a1a}
input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:22px;padding:10px 16px;color:#f0f0f0;font-size:13px;outline:none;transition:border-color 0.2s}
input:focus{border-color:#39ff14}
input::placeholder{color:#444}
button{width:40px;height:40px;background:#39ff14;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s}
button:hover{transform:scale(1.08)}
button svg{width:16px;height:16px;fill:#000}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">WV7</div>
    <div class="info">
      <h2>WV7 Funilaria <span class="badge">IA</span></h2>
      <p><span class="dot"></span>Atendimento online — São José, SC</p>
    </div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="input-area">
    <input id="inp" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')send()"/>
    <button onclick="send()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
  </div>
</div>
<script>
const m=document.getElementById('msgs');
const i=document.getElementById('inp');
let h=[];
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
async function send(){
  const v=i.value.trim();if(!v)return;
  add(v,'user');i.value='';
  h.push({role:'user',content:v});
  const t=add('digitando...','typing');
  try{
    const r=await fetch('https://chatbot-oficina-production.up.railway.app/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:h})});
    const d=await r.json();t.remove();
    if(d.reply){add(d.reply,'bot');h.push({role:'assistant',content:d.reply});}
    else{add('Erro: '+JSON.stringify(d),'bot');}
  }catch(e){t.remove();add('Erro: '+e.message,'bot');}
}
add('Olá! 👋 Bem-vindo à WV7 Funilaria e Pintura Automotiva!\n\nSou seu assistente virtual e vou te ajudar a solicitar um orçamento. Por onde você quer começar?','bot');
</script>
</body>
</html>
